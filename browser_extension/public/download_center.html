<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Download Center</title>
    <style>
      body {
        font-family: Roboto, sans-serif;
        margin: 0;
        padding: 1rem;
        background-color: #f8f9fa;
        color: #333;
      }

      h2 {
        margin-top: 0;
        margin-bottom: 1rem;
        font-size: 1.25rem;
        color: #444;
      }

      .toolbar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 1rem;
        gap: 0.5rem;
      }

      button {
        padding: 0.5rem 1rem;
        font-size: 0.95rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        transition: background-color 0.2s ease-in-out;
      }

      button:hover {
        background-color: #0056b3;
      }

      button#dismiss {
        background-color: #6c757d;
      }

      button#dismiss:hover {
        background-color: #5a6268;
      }

      #files {
        margin-top: 1rem;
      }

      .file {
        display: block;
        padding: 0.5rem 0;
        text-decoration: none;
        color: #007bff;
        font-weight: 500;
        transition: color 0.2s ease-in-out;
      }

      .file:hover {
        color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="dl">Download all</button>
      <button id="dismiss">Dismiss</button>
    </div>

    <h2>Pending Files</h2>
    <div id="files"></div>

    <script type="module" src="download_center.js"></script>
  </body>
</html>
